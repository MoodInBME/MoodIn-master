name: link-check

# Memeriksa tautan mati pada dokumen aktif: README.md, CHANGELOG.md, dan docs/*.md.
# Folder docs/arsip-gemastik/ sengaja tidak diperiksa karena isinya dibekukan.
# Berjalan saat push atau pull request ke main, terjadwal mingguan, dan manual.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 2 * * 1" # Senin 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --max-concurrency 8
            --accept 200,206,429
            README.md
            CHANGELOG.md
            'docs/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
