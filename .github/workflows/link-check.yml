name: link-check

# Memeriksa tautan mati pada berkas Markdown (README, docs/).
# Berjalan saat push/PR ke main & dev, dan terjadwal mingguan.

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 2 * * 1" # Senin 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --max-concurrency 8
            --accept 200,206,429
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
